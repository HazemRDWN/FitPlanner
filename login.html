<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In · FitPlanner</title>
    <link rel="stylesheet" href="./dist/output.css">
    <script src="./js/theme.js"></script>
  </head>
  <body class="min-h-screen">
    <div class="min-h-screen lg:grid lg:grid-cols-2">
      <aside class="flex flex-col px-[22px] pt-7 lg:min-h-screen lg:bg-surface-1 lg:p-14">
        <div class="flex flex-row justify-between items-center">
            <a href="index.html" aria-label="FitPlanner home" class="flex min-h-11 w-fit items-center gap-3 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-soft">
              <img src="./assets/logo-mark.svg" alt="" class="size-9 rounded-chip shadow-glow light:hidden">
              <img src="./assets/logo-mark-light.svg" alt="" class="hidden size-9 light:block">
              <span class="font-display text-[22px] font-bold">FITPLANNER</span>
            </a>
        </div>
        <div class="hidden flex-1 flex-col justify-center lg:flex lg:gap-6">
          <h2 class="max-w-md font-display text-6xl leading-[1.05] font-bold">Your streak is<br> waiting.</h2>
          <p class="font-body text-lg text-muted">Log in to resume your routines, finish today's session and<br> see this week's progress.</p>
        </div>
        <p class="hidden text-sm text-muted lg:block">© 2026 FitPlanner</p>
      </aside>
      <main id="main" class="px-[22px] pt-7 pb-14 lg:flex lg:min-h-screen lg:items-center lg:justify-center lg:px-12 lg:py-20">
        <div class="mx-auto w-full mt-[60px] max-w-[440px]">
            <h1 class="font-display text-[32px] leading-tight font-bold">Sign In</h1>
            <p class="hidden mt-2 text-lg text-muted lg:flex">Welcome back — pick up where you left off.</p>
            <p class="flex mt-2 text-lg text-muted lg:hidden">Welcome back — let's train.</p>
          <form action="dashboard.html" method="get" class="mt-5 space-y-5">
            <div>
              <label for="email" class="mb-2 block font-mono text-sm tracking-wider text-muted uppercase">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" class="h-15 w-full rounded-control bg-surface-2 px-5 text-lg placeholder:text-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-soft">
            </div>
            <div>
                <label for="password" class="mb-2 block font-mono text-sm tracking-wider text-muted uppercase">Password</label>
                <input id="password" type="password" autocomplete="current-password" required placeholder="Your password" class="h-15 w-full min-w-0 rounded-control bg-surface-2 px-5 text-lg placeholder:text-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-soft">
            </div>
            <div class="flex flex-row justify-between items-center">
                <div class="hidden min-h-11 items-center py-1 text-sm lg:text-base lg:flex">
                    <label for="terms" class="flex min-h-11 min-w-11 items-center justify-center">
                        <input id="remember" type="checkbox" class="size-6 accent-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-soft">
                    </label>
                    <p class="font-body text-lg text-fg">Remember me</p>
                </div>
                <a href="#" class="ml-auto font-body text-lg text-accent-soft underline">Forgot Password?</a>
            </div>
            <button type="submit" class="min-h-16 w-full rounded-control border-2 mt-[100px] border-accent bg-surface-1 font-display text-2xl font-bold shadow-glow hover:bg-surface-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-soft">Sign In</button>
          </form>
          <p class="mt-3 text-center text-base text-muted">Don't have an account? <a href="register.html" class="inline-flex min-h-11 items-center font-semibold text-accent-soft underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-soft">Create One</a></p>
        </div>
      </main>
    </div>
  </body>
</html>
